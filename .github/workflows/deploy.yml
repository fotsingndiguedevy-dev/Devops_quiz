name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/Devops_quiz
            # On force le serveur à ignorer les modifs locales et à prendre ce qu'il y a sur GitHub
            git fetch origin main
            git reset --hard origin/main
            # On supprime l'ancien build pour être sûr de recompiler
            rm -rf .next
            npm install
            npm run build
            pm2 restart devops-quiz
